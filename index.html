<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>OSRS Farm Command Center</title>
<style>
body{font-family:Arial;background:#2b2620;color:#f5e6b8;max-width:1200px;margin:auto;padding:20px}
.card{background:#3a332b;border:2px solid #8b6f3d;border-radius:10px;padding:15px;margin:15px 0}
input,select,button{padding:8px;margin:4px}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #666;padding:8px}
th{background:#4a4033}
.available{color:#7CFC00}
.locked{color:#ff7a7a}
</style>
</head>
<body>

<h1>🌿 OSRS Farm Command Center</h1>

<div class="card">
<h2>Farming Planner</h2>

<label>Farming Level:</label>
<input type="number" id="level" min="1" max="99" value="1">

<select id="categoryFilter" onchange="showCrops()">
<option value="All">All Categories</option>
<option value="Allotments">Allotments</option>
<option value="Herbs">Herbs</option>
<option value="Trees">Trees</option>
<option value="Fruit Trees">Fruit Trees</option>
<option value="Hardwood Trees">Hardwood Trees</option>
<option value="Bushes">Bushes</option>
<option value="Special">Special</option>
</select>

<input type="text" id="searchBox" placeholder="Search crop..." onkeyup="showCrops()">

<button onclick="showCrops()">Update</button>

<div id="cropList"></div>
</div>

<script>
const crops = [
{category:"Allotments",name:"Potato",level:1,req:"Potato seed"},
{category:"Allotments",name:"Onion",level:5,req:"Onion seed"},
{category:"Allotments",name:"Cabbage",level:7,req:"Cabbage seed"},
{category:"Allotments",name:"Tomato",level:12,req:"Tomato seed"},
{category:"Allotments",name:"Sweetcorn",level:20,req:"Sweetcorn seed"},
{category:"Allotments",name:"Strawberry",level:31,req:"Strawberry seed"},
{category:"Allotments",name:"Watermelon",level:47,req:"Watermelon seed"},
{category:"Allotments",name:"Snape Grass",level:61,req:"Snape grass seed"},

{category:"Herbs",name:"Guam",level:9,req:"Guam seed"},
{category:"Herbs",name:"Marrentill",level:14,req:"Marrentill seed"},
{category:"Herbs",name:"Tarromin",level:19,req:"Tarromin seed"},
{category:"Herbs",name:"Harralander",level:26,req:"Harralander seed"},
{category:"Herbs",name:"Ranarr",level:32,req:"Ranarr seed"},
{category:"Herbs",name:"Toadflax",level:38,req:"Toadflax seed"},
{category:"Herbs",name:"Irit",level:44,req:"Irit seed"},
{category:"Herbs",name:"Avantoe",level:50,req:"Avantoe seed"},
{category:"Herbs",name:"Kwuarm",level:56,req:"Kwuarm seed"},
{category:"Herbs",name:"Snapdragon",level:62,req:"Snapdragon seed"},
{category:"Herbs",name:"Cadantine",level:67,req:"Cadantine seed"},
{category:"Herbs",name:"Lantadyme",level:73,req:"Lantadyme seed"},
{category:"Herbs",name:"Dwarf Weed",level:79,req:"Dwarf weed seed"},
{category:"Herbs",name:"Torstol",level:85,req:"Torstol seed"},

{category:"Trees",name:"Oak",level:15,req:"Oak sapling"},
{category:"Trees",name:"Willow",level:30,req:"Willow sapling"},
{category:"Trees",name:"Maple",level:45,req:"Maple sapling"},
{category:"Trees",name:"Yew",level:60,req:"Yew sapling"},
{category:"Trees",name:"Magic",level:75,req:"Magic sapling"},

{category:"Fruit Trees",name:"Apple",level:27,req:"Apple sapling"},
{category:"Fruit Trees",name:"Banana",level:33,req:"Banana sapling"},
{category:"Fruit Trees",name:"Orange",level:39,req:"Orange sapling"},
{category:"Fruit Trees",name:"Curry",level:42,req:"Curry sapling"},
{category:"Fruit Trees",name:"Pineapple",level:51,req:"Pineapple sapling"},
{category:"Fruit Trees",name:"Papaya",level:57,req:"Papaya sapling"},
{category:"Fruit Trees",name:"Palm",level:68,req:"Palm sapling"},
{category:"Fruit Trees",name:"Dragonfruit",level:81,req:"Dragonfruit sapling"},

{category:"Hardwood Trees",name:"Teak",level:35,req:"Teak sapling"},
{category:"Hardwood Trees",name:"Mahogany",level:55,req:"Mahogany sapling"},

{category:"Bushes",name:"Redberry",level:10,req:"Redberry seed"},
{category:"Bushes",name:"Cadavaberry",level:22,req:"Cadavaberry seed"},
{category:"Bushes",name:"Dwellberry",level:36,req:"Dwellberry seed"},
{category:"Bushes",name:"Jangerberry",level:48,req:"Jangerberry seed"},
{category:"Bushes",name:"Whiteberry",level:59,req:"Whiteberry seed"},

{category:"Special",name:"Seaweed",level:23,req:"Seaweed spore"},
{category:"Special",name:"Cactus",level:55,req:"Cactus seed"},
{category:"Special",name:"Celastrus",level:85,req:"Celastrus seed"},
{category:"Special",name:"Redwood",level:90,req:"Redwood sapling"}
];

function showCrops(){
 const lvl = parseInt(document.getElementById('level').value || 1);
 const filter = document.getElementById('categoryFilter').value;
 const search = document.getElementById('searchBox').value.toLowerCase();

 const categories=[...new Set(crops.map(c=>c.category))];
 let html='';

 categories.forEach(cat=>{
   if(filter!=='All' && filter!==cat) return;

   let items=crops
     .filter(c=>c.category===cat)
     .filter(c=>c.name.toLowerCase().includes(search))
     .sort((a,b)=>a.level-b.level);

   if(items.length===0) return;

   html += `<h3>${cat}</h3>`;
   html += '<table><tr><th>Crop</th><th>Level</th><th>Status</th><th>Requirements</th><th>Payments</th>';

   items.forEach(item=>{
      const unlocked=lvl>=item.level;
      html += `<tr>
      <td>${item.name}</td>
      <td>${item.level}</td>
      <td class="${unlocked?'available':'locked'}">${unlocked?'✓ Available':'🔒 Locked'}</td>
      <td>${item.req}</td> <td>${item.source}</td>
      <td>${item.req}</td>
      </tr>`;
   });

   html += '</table>';
 });
 document.getElementById('cropList').innerHTML = html;
 localStorage.setItem('farmLevel',lvl);
}

document.getElementById('level').value = localStorage.getItem('farmLevel') || 1;
showCrops();
</script>
</body>
</html>
