<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSRS Ironman Farming Dashboard</title>
<style>
body{font-family:Arial,sans-serif;max-width:1000px;margin:40px auto;padding:20px}
table{border-collapse:collapse;width:100%;margin-top:20px}
th,td{border:1px solid #ccc;padding:8px}
th{background:#eee}
input{padding:8px;font-size:16px}
</style>
</head>
<body>
<h1>OSRS Ironman Farming Smart Dashboard</h1>

<label>Farming Level:
<input type="number" id="level" value="56" min="1" max="99" oninput="updateDashboard()">
</label>

<table>
<tr><th>Category</th><th>Recommendation</th><th>Payment</th><th>Source</th></tr>
<tr><td>Best Tree</td><td id="tree"></td><td id="treePay"></td><td id="treeSrc"></td></tr>
<tr><td>Best Fruit Tree</td><td id="fruit"></td><td id="fruitPay"></td><td id="fruitSrc"></td></tr>
<tr><td>Best Hardwood</td><td id="hardwood"></td><td id="hardwoodPay"></td><td id="hardwoodSrc"></td></tr>
<tr><td>Best Herb</td><td id="herb"></td><td>-</td><td>-</td></tr>
<tr><td>Next Goal</td><td id="goal"></td><td>-</td><td>-</td></tr>
</table>

<script>
const data=[
{lvl:1,tree:"Oak",treePay:"Basket of tomatoes",treeSrc:"Allotments",fruit:"Apple",fruitPay:"9 Sweetcorn",fruitSrc:"Allotments",hard:"-",hardPay:"-",hardSrc:"-",herb:"Guam",goal:"15 Farming"},
{lvl:30,tree:"Willow",treePay:"Basket of apples",treeSrc:"Cooking Guild",fruit:"Banana",fruitPay:"4 Baskets of apples",fruitSrc:"Cooking Guild",hard:"-",hardPay:"-",hardSrc:"-",herb:"Harralander",goal:"45 Farming"},
{lvl:45,tree:"Maple",treePay:"Basket of oranges",treeSrc:"Gnome Food Shop",fruit:"Orange",fruitPay:"3 Baskets strawberries",fruitSrc:"Allotments",hard:"Teak",hardPay:"15 Limpwurt roots",hardSrc:"Flower patches",herb:"Ranarr",goal:"57 Farming"},
{lvl:51,tree:"Maple",treePay:"Basket of oranges",treeSrc:"Gnome Food Shop",fruit:"Pineapple",fruitPay:"10 Watermelons",fruitSrc:"Allotments",hard:"Teak",hardPay:"15 Limpwurt roots",hardSrc:"Flower patches",herb:"Ranarr",goal:"57 Farming"},
{lvl:57,tree:"Maple",treePay:"Basket of oranges",treeSrc:"Gnome Food Shop",fruit:"Papaya",fruitPay:"10 Pineapples",fruitSrc:"Karamja plantation",hard:"Mahogany",hardPay:"25 Yanillian hops",hardSrc:"Hops patches",herb:"Ranarr",goal:"65 Farming Contracts"},
{lvl:68,tree:"Maple",treePay:"Basket of oranges",treeSrc:"Gnome Food Shop",fruit:"Palm",fruitPay:"15 Papaya fruits",fruitSrc:"Papaya trees",hard:"Mahogany",hardPay:"25 Yanillian hops",hardSrc:"Hops patches",herb:"Ranarr",goal:"72 Farming"},
{lvl:75,tree:"Magic",treePay:"25 Coconuts",treeSrc:"Palm trees",fruit:"Palm",fruitPay:"15 Papaya fruits",fruitSrc:"Papaya trees",hard:"Mahogany",hardPay:"25 Yanillian hops",hardSrc:"Hops patches",herb:"Ranarr",goal:"81 Farming"},
{lvl:81,tree:"Magic",treePay:"25 Coconuts",treeSrc:"Palm trees",fruit:"Dragonfruit",fruitPay:"15 Coconuts",fruitSrc:"Palm trees",hard:"Mahogany",hardPay:"25 Yanillian hops",hardSrc:"Hops patches",herb:"Snapdragon",goal:"99 Farming"}
];

function updateDashboard(){
 const lvl=parseInt(document.getElementById('level').value)||1;
 let rec=data[0];
 for(const r of data){ if(lvl>=r.lvl) rec=r; }
 tree.textContent=rec.tree;
 treePay.textContent=rec.treePay;
 treeSrc.textContent=rec.treeSrc;
 fruit.textContent=rec.fruit;
 fruitPay.textContent=rec.fruitPay;
 fruitSrc.textContent=rec.fruitSrc;
 hardwood.textContent=rec.hard;
 hardwoodPay.textContent=rec.hardPay;
 hardwoodSrc.textContent=rec.hardSrc;
 herb.textContent=rec.herb;
 goal.textContent=rec.goal;
}
updateDashboard();
</script>
</body>
</html>
