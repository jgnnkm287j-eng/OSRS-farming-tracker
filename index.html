<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>OSRS Farm Command Center</title>
<style>
body{font-family:Arial;background:#2b2620;color:#f5e6b8;max-width:1200px;margin:auto;padding:20px}
.card{background:#3a332b;border:2px solid #8b6f3d;border-radius:10px;padding:15px;margin:15px 0}
input,select,button{padding:8px;margin:4px}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #666;padding:8px}
th{background:#4a4033}
.available{color:#7CFC00}
.locked{color:#ff7a7a}
</style>
</head>
<body>
<div class="card">
    <h2>Farming Planner</h2>

    <label>Farming Level:</label>
    <input type="number" id="level" min="1" max="99" value="1">

    <select id="categoryFilter" onchange="showCrops()">
        <option value="All">All Categories</option>
        <option value="Allotments">Allotments</option>
        <option value="Herbs">Herbs</option>
        <option value="Trees">Trees</option>
        <option value="Fruit Trees">Fruit Trees</option>
        <option value="Hardwood Trees">Hardwood Trees</option>
        <option value="Bushes">Bushes</option>
        <option value="Special">Special</option>
    </select>

    <input
        type="text"
        id="searchBox"
        placeholder="Search crop..."
        onkeyup="showCrops()">

    <button onclick="showCrops()">Update</button>

    <div id="cropList"></div>
</div>

</body>
</html>
